<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="sidebox">
            <a class="brand" href="index.html">FlowCash</a>
            <div class="tabs">
                <a class="active" href="index.html">Dashboard</a>
                <a href="transaction.html">Transactions</a>
                <a href="reports.html">Reports</a>
                <a href="budgets.html">Budgets</a>
                <a href="settings.html">Settings</a>
            </div>
        </div>

        <div class="mainbox">
            <div class="top">
                <div>
                    <h1>Hello, Kratik</h1>
                    <p>Welcome back</p>
                </div>

                <button>Add Expense</button>
            </div>

            <div class="stats">
                <div class="box">
                    <p>Outcome</p>
                    <h2>₹1234</h2>
                </div>
                <div class="box">
                    <p>Income</p>
                    <h2>₹10,000</h2>
                </div>
                <div class="box">
                    <p>Balance</p>
                    <h2>₹9,776</h2>
                </div>
            </div>

            <div class="history">
                <div class="box2">
                    <h3>Quick add</h3>

                    <label>Expense name</label>
                    <input name="name" type="text" placeholder="e.g. Lunch" required>

                    <label>Amount</label>
                    <input name="amount" type="number" placeholder="0" required>

                    <label>Category</label>
                    <select name="category">
                        <option>Food</option>
                        <option>Entertainment</option>
                        <option>Transportation</option>
                        <option>Shopping</option>
                        <option>Other</option>
                    </select>

                    <label>Date</label>
                    <input name="date" type="date" required>

                    <button class="expense-btn" type="submit">
                        Add expense
                    </button>
                </div>
                <div class="box2">
                    <h3>Recent Activity</h3>
                </div>

            </div>
        </div>
        <div class="reportbox"></div>
    </div>
</body>

</html>
