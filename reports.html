<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebox">
            <a class="brand" href="dashboard.html">FlowCash</a>
            <div class="tabs">
                <a href="dashboard.html">Dashboard</a>
                <a href="transaction.html">Transactions</a>
                <a class="active" href="reports.html">Reports</a>
                <a href="settings.html">Settings</a>
            </div>
        </div>

        <div class="mainbox">
            <div class="top">
                <div>
                    <h1>Reports</h1>
                    <p>Spending by month</p>
                </div>

                    <select name="month">
                        <option value="">October 2026</option>
                        <option value="">September 2026</option>
                        <option value="">August 2026</option>
                    </select>
            </div>

            <div class="stats">
                <div class="box">
                    <p>Income</p>
                    <h2>₹0</h2>
                </div>
                <div class="box">
                    <p>Expence</p>
                    <h2>₹1000</h2>
                </div>
                <div class="box">
                    <p>Balance</p>
                    <h2>-₹1000</h2>
                </div>
            </div>
        </div>
        <div class="reportbox"></div>
    </div>
</body>
</html>
